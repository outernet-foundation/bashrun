name: Merge gate

on:
  pull_request:
    branches: [dev]
    types: [labeled]

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  merge-gate:
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/merge-gate.yml@feef989f2573cf383895aeb6da9dbccd61b189f7
    secrets:
      merge-bot-private-key: ${{ secrets.MERGE_BOT_APP_PRIVATE_KEY }}
