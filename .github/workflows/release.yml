name: Release

on:
  push:
    branches: [main, dev]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  prerelease:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/release@feef989f2573cf383895aeb6da9dbccd61b189f7

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/release@feef989f2573cf383895aeb6da9dbccd61b189f7
        with:
          stable: true
