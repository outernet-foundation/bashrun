name: Integrate

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/preflight.yml@8ac57f2e9cf9817b053c27b7ebcf2c16e18001d0

  update-pr-draft-release:
    needs: [preflight]
    permissions:
      contents: write
      packages: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/update-pr-draft-release.yml@8ac57f2e9cf9817b053c27b7ebcf2c16e18001d0
