name: Integrate

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/preflight.yml@f38c86a3ae743e267d07440f95052a44203320b7

  update-pr-draft-release:
    needs: [preflight]
    permissions:
      contents: write
      packages: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/update-pr-draft-release.yml@f38c86a3ae743e267d07440f95052a44203320b7
