name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

# Cancel superseded runs on the same branch, except main — where publish-stable
# must never die mid-release (overlapping release merges queue instead).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  RELEASE_DEVKIT_SHA: 3cc368eb6a612f305cad438319252d7142b8699b

jobs:
  check:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv lock --check --project tools/devkit
      - run: uv run --project tools/devkit preflight-python
      - uses: actions/checkout@v5
        with:
          repository: outernet-foundation/release-devkit
          ref: ${{ env.RELEASE_DEVKIT_SHA }}
          path: .release-devkit
          persist-credentials: false
      - uses: ./.release-devkit/.github/actions/publish-stable
        with:
          dry-run: true
          checkout: false

  ensure-release-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: outernet-foundation/release-devkit
          ref: ${{ env.RELEASE_DEVKIT_SHA }}
          path: .release-devkit
          persist-credentials: false
      - uses: ./.release-devkit/.github/actions/ensure-release-pr

  publish-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: outernet-foundation/release-devkit
          ref: ${{ env.RELEASE_DEVKIT_SHA }}
          path: .release-devkit
          persist-credentials: false
      - uses: ./.release-devkit/.github/actions/publish-stable

  publish-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [check]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: outernet-foundation/release-devkit
          ref: ${{ env.RELEASE_DEVKIT_SHA }}
          path: .release-devkit
          persist-credentials: false
      - uses: ./.release-devkit/.github/actions/publish-dev
